name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Unit tests use fake chat models: no LLM, no API key, no warehouse.
      - name: Run the unit tests
        run: uv run pytest -m "not integration"

  integration:
    name: Integration tests on the Olist warehouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist -d olist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: olist
      # Admin account: loads the warehouse and creates the read-only role.
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      # Read-only account used by the agent.
      AGENT_DB_USER: olist_agent
      AGENT_DB_PASSWORD: ci-agent-password
      DBT_PROFILES_DIR: ${{ github.workspace }}/warehouse/dbt
      DBT_MANIFEST_PATH: ${{ github.workspace }}/warehouse/dbt/target/manifest.json
      # Fail instead of skipping when the warehouse is unreachable.
      REQUIRE_WAREHOUSE: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check out Olist-Analytics (the warehouse)
        uses: actions/checkout@v7
        with:
          repository: CyrilleAdrien/Olist-Analytics
          path: warehouse

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt

      - name: Install the warehouse dependencies
        run: pip install -r warehouse/requirements.txt

      - name: Load the CI sample into the raw schema
        working-directory: warehouse
        run: python ingestion/load_raw.py --data-dir data/sample

      - name: Build the marts with dbt
        working-directory: warehouse/dbt
        run: |
          dbt deps
          dbt build

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dependencies
        run: uv sync --locked

      - name: Create the read-only role
        run: uv run python scripts/create_readonly_role.py

      - name: Run the integration tests
        run: uv run pytest -m integration
