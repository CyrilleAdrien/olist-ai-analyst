[project]
name = "olist-ai-analyst"
version = "0.1.0"
description = "AI agent that answers business questions on the Olist warehouse with read-only SQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "langgraph>=1.2",
    "sqlglot>=30.0",
    "plotly>=7.0",
]

[project.optional-dependencies]
groq = ["langchain-groq>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]

[project.scripts]
olist-ai-analyst = "olist_ai_analyst.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL warehouse (skipped otherwise)"]
