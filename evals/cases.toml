# Evaluation set: questions in French with the SQL that gives the right answer.
# The agent passes a case when its result holds the same values as the reference result
# (column names and row order are ignored, numbers are compared to 2 decimals).
# These questions must stay different from the few-shot examples of examples.py.
#
# expect = "out_of_scope": the agent passes when it runs nothing (declines or gives up).

[[cases]]
id = "kpi_revenue"
category = "kpi"
question = "Quel est le chiffre d'affaires total des commandes livrées ?"
sql = "select sum(items_revenue_brl) from fct_orders where is_delivered"

[[cases]]
id = "kpi_orders"
category = "kpi"
question = "Combien de commandes ont été livrées ?"
sql = "select count(distinct order_id) from fct_orders where is_delivered"

[[cases]]
id = "kpi_basket"
category = "kpi"
question = "Quel est le panier moyen par commande livrée ?"
sql = "select round(sum(items_revenue_brl) / count(distinct order_id), 2) from fct_orders where is_delivered"

[[cases]]
id = "kpi_review_score"
category = "kpi"
question = "Quelle est la note moyenne laissée par les clients sur les commandes livrées ?"
sql = "select round(avg(review_score), 2) from fct_orders where is_delivered"

[[cases]]
id = "kpi_freight"
category = "kpi"
question = "Combien ont coûté les frais de port au total sur les commandes livrées ?"
sql = "select sum(freight_value_brl) from fct_orders where is_delivered"

[[cases]]
id = "kpi_delivery_days"
category = "kpi"
question = "Quel est le délai moyen de livraison, en jours ?"
sql = "select round(avg(delivery_days), 2) from fct_orders where is_delivered"

[[cases]]
id = "kpi_late_rate"
category = "kpi"
question = "Quel pourcentage des commandes livrées est arrivé en retard ?"
sql = "select round(100.0 * count(*) filter (where is_late) / count(*), 2) from fct_orders where is_delivered"

[[cases]]
id = "kpi_repeat_rate"
category = "kpi"
question = "Quel pourcentage des clients ayant reçu une commande en ont reçu au moins deux ?"
sql = """
select round(100.0 * count(*) filter (where is_repeat_customer)
       / count(*) filter (where has_delivered_order), 2)
from dim_customers
"""

[[cases]]
id = "time_orders_per_year"
category = "time"
question = "Combien de commandes ont été livrées chaque année ?"
sql = """
select d.year_number, count(*)
from fct_orders as o join dim_dates as d on o.order_date = d.date_day
where o.is_delivered group by d.year_number
"""

[[cases]]
id = "time_revenue_per_quarter_2018"
category = "time"
question = "Quel est le chiffre d'affaires par trimestre en 2018 ?"
sql = """
select d.quarter_number, sum(o.items_revenue_brl)
from fct_orders as o join dim_dates as d on o.order_date = d.date_day
where o.is_delivered and d.year_number = 2018 group by d.quarter_number
"""

[[cases]]
id = "time_best_month_2017"
category = "time"
question = "Quel mois de 2017 a compté le plus de commandes livrées ?"
sql = """
select d.month_start, count(*) as orders
from fct_orders as o join dim_dates as d on o.order_date = d.date_day
where o.is_delivered and d.year_number = 2017
group by d.month_start order by orders desc limit 1
"""

[[cases]]
id = "time_new_customers_2018"
category = "time"
question = "Combien de nouveaux clients, ayant reçu au moins une commande, par mois en 2018 ?"
sql = """
select d.month_start, count(*)
from dim_customers as c join dim_dates as d on c.first_order_date = d.date_day
where c.has_delivered_order and d.year_number = 2018 group by d.month_start
"""

[[cases]]
id = "time_weekend"
category = "time"
question = "Combien de commandes livrées ont été passées le week-end, et combien en semaine ?"
sql = """
select d.is_weekend, count(*)
from fct_orders as o join dim_dates as d on o.order_date = d.date_day
where o.is_delivered group by d.is_weekend
"""

[[cases]]
id = "time_delivery_days_2018"
category = "time"
question = "Comment évolue le délai moyen de livraison, en jours, mois par mois en 2018 ?"
sql = """
select d.month_start, round(avg(o.delivery_days), 2)
from fct_orders as o join dim_dates as d on o.order_date = d.date_day
where o.is_delivered and d.year_number = 2018 group by d.month_start
"""

[[cases]]
id = "rank_states_customers"
category = "ranking"
question = "Quels sont les 5 États qui comptent le plus de clients ?"
sql = """
select customer_state, count(*) as customers from dim_customers
group by customer_state order by customers desc limit 5
"""

[[cases]]
id = "rank_categories_items"
category = "ranking"
question = "Quelles sont les 10 catégories qui ont vendu le plus d'articles livrés ?"
sql = """
select p.product_category_name_english, count(*) as items
from fct_order_items as i join dim_products as p on i.product_id = p.product_id
where i.is_delivered group by p.product_category_name_english order by items desc limit 10
"""

[[cases]]
id = "rank_sellers_revenue"
category = "ranking"
question = "Quels sont les 5 vendeurs qui ont réalisé le plus de chiffre d'affaires sur les commandes livrées ?"
sql = """
select seller_id, sum(price_brl) as revenue from fct_order_items
where is_delivered group by seller_id order by revenue desc limit 5
"""

[[cases]]
id = "rank_states_sellers"
category = "ranking"
question = "Quels sont les 5 États qui comptent le plus de vendeurs ?"
sql = """
select seller_state, count(*) as sellers from dim_sellers
group by seller_state order by sellers desc limit 5
"""

[[cases]]
id = "rank_basket_by_payment"
category = "ranking"
question = "Quel est le panier moyen des commandes livrées selon le moyen de paiement principal ?"
sql = """
select main_payment_type, round(sum(items_revenue_brl) / count(distinct order_id), 2)
from fct_orders where is_delivered group by main_payment_type
"""

[[cases]]
id = "rank_cities_orders"
category = "ranking"
question = "Quelles sont les 5 villes de clients avec le plus de commandes livrées ?"
sql = """
select c.customer_city, count(*) as orders
from fct_orders as o join dim_customers as c on o.customer_unique_id = c.customer_unique_id
where o.is_delivered group by c.customer_city order by orders desc limit 5
"""

[[cases]]
id = "filter_health_beauty"
category = "ranking"
question = "Quel est le chiffre d'affaires de la catégorie health_beauty sur les commandes livrées ?"
sql = """
select sum(i.price_brl)
from fct_order_items as i join dim_products as p on i.product_id = p.product_id
where i.is_delivered and p.product_category_name_english = 'health_beauty'
"""

[[cases]]
id = "rank_categories_products"
category = "ranking"
question = "Quelles sont les 5 catégories avec le plus de produits différents vendus ?"
sql = """
select p.product_category_name_english, count(distinct i.product_id) as products
from fct_order_items as i join dim_products as p on i.product_id = p.product_id
group by p.product_category_name_english order by products desc limit 5
"""

[[cases]]
id = "rate_late_by_state"
category = "rate"
question = "Quels sont les 5 États où le pourcentage de commandes livrées en retard est le plus élevé ?"
sql = """
select c.customer_state, round(100.0 * count(*) filter (where o.is_late) / count(*), 2) as late_pct
from fct_orders as o join dim_customers as c on o.customer_unique_id = c.customer_unique_id
where o.is_delivered group by c.customer_state order by late_pct desc limit 5
"""

[[cases]]
id = "rate_score_late"
category = "rate"
question = "Quelle est la note moyenne des commandes livrées en retard, et celle des commandes à l'heure ?"
sql = """
select is_late, round(avg(review_score), 2) from fct_orders
where is_delivered group by is_late
"""

[[cases]]
id = "rate_credit_card"
category = "rate"
question = "Quel pourcentage des commandes livrées a été payé principalement par carte de crédit ?"
sql = """
select round(100.0 * count(*) filter (where main_payment_type = 'credit_card') / count(*), 2)
from fct_orders where is_delivered
"""

[[cases]]
id = "rate_status"
category = "rate"
question = "Combien y a-t-il de commandes pour chaque statut ?"
sql = "select order_status, count(*) from fct_orders group by order_status"

